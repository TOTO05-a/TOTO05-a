name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0F172A&color_dots=#E2E8F0,#99F6E4,#5EEAD4,#14B8A6,#0F766E
            dist/github-snake-dark.svg?color_snake=#F8FAFC&color_dots=#1E293B,#134E4A,#0F766E,#14B8A6,#5EEAD4

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}